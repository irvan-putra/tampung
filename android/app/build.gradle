plugins { id 'com.android.application' }
android {
    namespace 'com.vanipy.tampung'
    compileSdk 35
    defaultConfig {
        applicationId 'com.vanipy.tampung'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        buildConfigField 'boolean', 'DRIVE_CONFIGURED', 'false'
    }
    buildFeatures { buildConfig true }
    sourceSets.main.java.srcDirs += '../../core'
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { implementation 'com.google.android.gms:play-services-auth:22.0.0' }
